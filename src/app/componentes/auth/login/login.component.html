<div class="text-white">
  <h1>¡INICIA TU SESION PARA EMPEZAR A ESTUDIAR!</h1>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="email">Correo Electrónico:</label>
      <input id="email" formControlName="email" type="email" required />
    </div>

    <div>
      <label for="password">Contraseña:</label>
      <input
        id="password"
        formControlName="password"
        type="password"
        required
      />
    </div>

    <button type="submit">Iniciar Sesión</button>
  </form>
 <!--<p><a routerLink="/login"></a>He olvidado la contraseña</p>-->
  <p><a routerLink="/sigin">¿No tienes una cuenta?</a> o</p>
  <button type="button">
    <img src="" alt="icono google" />Seguir con google
  </button>
  <button type="button">
    <img src="" alt="icono facebook" />Seguir con facebook
  </button>
</div>
