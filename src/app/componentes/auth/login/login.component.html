<div
  class="d-flex justify-content-center align-items-center min-vh-100 text-white position-relative overflow-hidden"
>
  <!-- Imágenes decorativas de fondo -->
  <img
    src="/assets/Vector4.png"
    class="position-absolute bottom-0 start-0"
  />
  <img
    src="/assets/Vector3.png"
    class="position-absolute top-0 end-0"
  />

  <!-- Contenedor principal -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        <!-- Título principal -->
        <div class="text-center mb-5">
          <h1 class="display-5 fw-bold mb-3">
            ¡INICIA TU SESIÓN PARA EMPEZAR A ESTUDIAR!
          </h1>
          <p class="text-white-50 fs-6">
            Accede a tu cuenta para continuar aprendiendo
          </p>
        </div>

        <!-- Card del formulario -->
        <div class="card card-bg-gradient bg-opacity-75 border-0 shadow-lg rounded-4">
          <div class="card-body p-4 p-md-5">
            <form>
              <!-- Campo de email -->
              <div class="mb-4">
                <label for="email" class="form-label fw-semibold">
                  Correo electrónico
                </label>
                <input
                  type="email"
                  class="form-control form-control-lg rounded-3 bg-dark text-white border-secondary"
                  id="email"
                  placeholder="ejemplo@correo.com"
                  aria-label="Correo electrónico"
                />
              </div>

              <!-- Campo de contraseña -->
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">
                  Contraseña
                </label>
                <div class="input-group">
                  <input
                    type="password"
                    class="form-control form-control-lg rounded-3 bg-dark text-white border-secondary"
                    id="password"
                    placeholder="Introduce tu contraseña"
                    aria-label="Contraseña"
                  />
                </div>
                <div class="form-text text-white-50 mt-2">
                  Mínimo 8 caracteres
                </div>
              </div>

              <!-- Botón de inicio de sesión -->
              <div class="d-grid gap-2 mb-4">
                <button
                  type="button"
                  class="btn btn-primary btn-lg rounded-pill py-3 fw-semibold shadow-sm"
                  routerLink="/componentes/home"
                >
                  Iniciar sesión
                </button>
              </div>

              <div class="text-center mb-4">
                <a
                  routerLink="/componentes/auth/recuperar-contraseña"
                  class="text-decoration-none text-primary-emphasis"
                >
                  <small class="fw-medium">¿Olvidaste tu contraseña?</small>
                </a>
              </div>

              <!-- Separador -->
              <div class="position-relative my-4">
                <hr class="text-white-50 opacity-25" />
                <span
                  class="position-absolute top-50 start-50 translate-middle px-3 text-white-50"
                >
                </span>
              </div>

              <!-- Botones de redes sociales -->
              <div class="d-grid gap-3">
                <button
                  type="button"
                  class="btn btn-outline-light btn-lg rounded-pill d-flex align-items-center justify-content-center gap-3 py-3"
                  routerLink="/componentes/auth/login"
                >
                  <i class="bi bi-google fs-5"></i>
                  <span class="fw-medium">Continuar con Google</span>
                </button>

                <button
                  type="button"
                  class="btn btn-outline-light btn-lg rounded-pill d-flex align-items-center justify-content-center gap-3 py-3"
                  routerLink="/componentes/auth/login"
                >
                  <i class="bi bi-facebook fs-5"></i>
                  <span class="fw-medium">Continuar con Facebook</span>
                </button>
              </div>

              <div
                class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25"
              >
                <p class="text-white-50 mb-2">¿No tienes una cuenta?</p>
                <a
                  routerLink="/componentes/auth/sigin"
                  class="text-decoration-none fw-semibold text-white"
                >
                  Regístrate gratis
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
