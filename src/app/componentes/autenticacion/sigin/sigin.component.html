<div class="d-flex justify-content-center align-items-center min-vh-100 position-relative overflow-hidden">
  
  <div class="container py-5 z-1">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        
        <div class="text-center mb-5 mt-4">
          <div class="mb-3">
            <i class="bi bi-person-badge display-1 text-primary shadow-sm"></i>
          </div>
          <h1 class="display-6 fw-bold mb-3 text-uppercase text-white text-center">
            ¡Regístrate y <span class="text-primary fw-bolder">Aprende</span>!
          </h1>
          <p class="text-white-50 fs-6 px-4">Crea tu cuenta en segundos y únete a nuestra comunidad de aprendizaje avanzada</p>
        </div>

        <div class="card bg-dark bg-opacity-75 border border-secondary border-opacity-50 shadow-lg rounded-4 overflow-hidden">
          <div class="card-body p-4 p-md-5">
            <form [formGroup]="registerForm" (ngSubmit)="register()">

              <div class="mb-4">
                <label for="username" class="form-label fw-semibold text-white small mb-2 tracking-wide">NOMBRE DE USUARIO</label>
                <div class="input-group">
                  <span class="input-group-text bg-black border-secondary text-white-50"><i class="bi bi-person fs-5"></i></span>
                  <input type="text" class="form-control form-control-lg bg-black text-white border-secondary shadow-none fs-6"
                    id="username" placeholder="Tu nombre único" formControlName="username" />
                </div>
              </div>

              <div class="mb-4">
                <label for="email" class="form-label fw-semibold text-white small mb-2 tracking-wide">CORREO ELECTRÓNICO</label>
                <div class="input-group">
                  <span class="input-group-text bg-black border-secondary text-white-50"><i class="bi bi-envelope fs-5"></i></span>
                  <input type="email" class="form-control form-control-lg bg-black text-white border-secondary shadow-none fs-6"
                    id="email" placeholder="ejemplo@correo.com" formControlName="email" />
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-white small mb-2 tracking-wide">CONTRASEÑA</label>
                <div class="input-group">
                  <span class="input-group-text bg-black border-secondary text-white-50"><i class="bi bi-lock fs-5"></i></span>
                  <input type="password"
                    class="form-control form-control-lg bg-black text-white border-secondary shadow-none fs-6" id="password"
                    placeholder="Mínimo 8 caracteres" formControlName="password" />
                </div>
              </div>

              <div class="d-grid gap-2 mb-4 mt-5">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill py-3 fw-bold shadow-sm tracking-wider fs-6 text-uppercase"
                  [disabled]="registerForm.invalid || loading">
                  <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                  <i *ngIf="!loading" class="bi bi-check-circle me-2"></i>
                  {{ loading ? 'CREANDO...' : 'REGISTRARME AHORA' }}
                </button>
              </div>

              <div *ngIf="errores" class="alert alert-danger bg-transparent border-danger text-danger mb-4 py-2 small d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-exclamation-octagon fs-5"></i>
                <span>{{ mensajeError }}</span>
              </div>

              <div class="d-flex align-items-center mb-4 mt-3">
                <hr class="flex-grow-1 text-white-50 opacity-25">
                <span class="px-3 text-white-50 small text-uppercase fw-medium tracking-wider opacity-75">O CONTINÚA CON</span>
                <hr class="flex-grow-1 text-white-50 opacity-25">
              </div>

              <div class="d-grid gap-3">
                <button type="button"
                  class="btn btn-outline-light btn-lg rounded-pill d-flex align-items-center justify-content-center gap-3 py-3 shadow-sm border-secondary"
                  (click)="loginWithGoogle()" [disabled]="loading">
                  <i class="bi bi-google fs-5"></i>
                  <span class="fw-medium">Google</span>
                </button>
              </div>

              <div class="text-center mt-5 pt-3 border-top border-secondary border-opacity-25">
                <p class="small text-white-50 mb-0">¿Ya eres parte de la comunidad? 
                  <a routerLink="/componentes/autenticacion/login" class="text-primary text-decoration-none fw-bold ms-1">Inicia sesión</a>
                </p>
              </div>

            </form>
          </div>
        </div>
        
        <div class="py-4"></div>

      </div>
    </div>
  </div>
</div>
