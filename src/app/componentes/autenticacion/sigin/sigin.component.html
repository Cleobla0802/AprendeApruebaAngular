<div class="d-flex justify-content-center align-items-center min-vh-100 text-white position-relative overflow-hidden">
  <!-- Imágenes decorativas de fondo -->
  <img src="/assets/Vector4.png" class="position-absolute bottom-0 start-0" />
  <img src="/assets/Vector3.png" class="position-absolute top-0 end-0" />

  <!-- Contenedor principal -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        <!-- Título principal -->
        <div class="text-center mb-5">
          <h1 class="display-5 fw-bold mb-3">
            ¡REGISTRATE Y EXPERIMENTA EL SIGUIENTE NIVEL DE APREDIZAJE!
          </h1>
          <p class="text-white-50 fs-6">
            Accede a tu cuenta para continuar aprendiendo
          </p>
        </div>

        <!-- Card del formulario -->
        <div class="card card-bg-gradient bg-opacity-75 border-0 shadow-lg rounded-4">
          <!-- Campo del username -->
          <div class="card-body p-4 p-md-5">
            <form [formGroup]="registerForm" (ngSubmit)="register()">

              <!-- Campo del username -->
              <div class="mb-4">
                <label for="username" class="form-label fw-semibold">Nombre de usuario</label>
                <input type="text" class="form-control form-control-lg rounded-3 bg-dark text-white border-secondary"
                  id="username" placeholder="Username" aria-label="Nombre de usuario" formControlName="username" />
              </div>

              <!-- Campo de email -->
              <div class="mb-4">
                <label for="email" class="form-label fw-semibold">Correo electrónico</label>
                <input type="email" class="form-control form-control-lg rounded-3 bg-dark text-white border-secondary"
                  id="email" placeholder="ejemplo@correo.com" aria-label="Correo electrónico" formControlName="email" />
              </div>

              <!-- Campo de contraseña -->
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <div class="input-group">
                  <input type="password"
                    class="form-control form-control-lg rounded-3 bg-dark text-white border-secondary" id="password"
                    placeholder="Introduce tu contraseña" aria-label="Contraseña" formControlName="password" />
                </div>
                <div class="form-text text-white-50 mt-2">Mínimo 8 caracteres</div>
              </div>

              <!-- Botón de registro -->
              <div class="d-grid gap-2 mb-4">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill py-3 fw-semibold shadow-sm"
                  [disabled]="registerForm.invalid">
                  Registrarse
                </button>
              </div>

              <div *ngIf="errores" class="text-danger mb-3">
                Todos los campos son obligatorios o son incorrectos
              </div>

              <!-- Botones de redes sociales -->
              <div class="d-grid gap-3">
                <button type="button"
                  class="btn btn-outline-light btn-lg rounded-pill d-flex align-items-center justify-content-center gap-3 py-3"
                  (click)="loginWithGoogle()">
                  <i class="bi bi-google fs-5"></i>
                  <span class="fw-medium">Continuar con Google</span>
                </button>
              </div>

            </form>


          </div>
        </div>
      </div>
    </div>
  </div>
</div>
