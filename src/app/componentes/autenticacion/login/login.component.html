<div class="d-flex justify-content-center align-items-center min-vh-100 position-relative overflow-hidden">
  
  <div class="container py-5 z-1">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        
        <div class="text-center mb-5">
          <div class="mb-3">
            <i class="bi bi-shield-lock display-1 text-primary"></i>
          </div>
          <h1 class="display-6 fw-bold mb-3 text-uppercase text-white text-center">
            ¡Hola de <span class="text-primary">Nuevo</span>!
          </h1>
          <p class="text-white-50 small px-4 text-center">Introduce tus credenciales para acceder a tu panel</p>
        </div>

        <div class="card bg-dark border border-secondary shadow-lg rounded-4">
          <div class="card-body p-4 p-md-5">
            <form [formGroup]="loginForm" (ngSubmit)="login()">

              <div class="mb-4">
                <label for="email" class="form-label fw-semibold text-white small mb-2">CORREO ELECTRÓNICO</label>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-white-50">
                    <i class="bi bi-envelope fs-5"></i>
                  </span>
                  <input type="email" 
                    class="form-control form-control-lg bg-dark text-white border-secondary shadow-none fs-6"
                    id="email" 
                    placeholder="ejemplo@correo.com" 
                    formControlName="email"
                    autocomplete="email" />
                </div>
              </div>

              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <label for="password" class="form-label fw-semibold text-white small mb-0">CONTRASEÑA</label>
                  <a routerLink="/componentes/autenticacion/recuperar-password" class="text-primary text-decoration-none small fw-medium">
                    He olvidado mi contraseña
                  </a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-white-50">
                    <i class="bi bi-key fs-5"></i>
                  </span>
                  <input type="password" 
                    class="form-control form-control-lg bg-dark text-white border-secondary shadow-none fs-6"
                    id="password" 
                    placeholder="Tu contraseña" 
                    formControlName="password"
                    autocomplete="current-password" />
                </div>
              </div>

              <div *ngIf="errores" class="alert alert-danger bg-transparent border-danger text-danger mb-4 py-2 small d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-exclamation-octagon"></i>
                <span>{{ mensajeError }}</span>
              </div>

              <div class="d-grid gap-2 mb-4 mt-2">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill py-3 fw-bold shadow-sm text-uppercase"
                  [disabled]="loginForm.invalid || loading">
                  <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                  {{ loading ? 'ENTRANDO...' : 'INICIAR SESIÓN' }}
                </button>
              </div>

              <div class="d-flex align-items-center mb-4 mt-3">
                <hr class="flex-grow-1 text-white-50 opacity-25">
                <span class="px-3 text-white-50 small text-uppercase fw-medium opacity-75">O</span>
                <hr class="flex-grow-1 text-white-50 opacity-25">
              </div>

              <div class="d-grid gap-3">
                <button type="button"
                  class="btn btn-outline-light btn-lg rounded-pill d-flex align-items-center justify-content-center gap-3 py-3 border-secondary shadow-none"
                  (click)="loginWithGoogle()" [disabled]="loading">
                  <i class="bi bi-google fs-5 text-white"></i>
                  <span class="fw-medium text-white">Google</span>
                </button>
              </div>

              <div class="text-center mt-5 pt-3 border-top border-secondary border-opacity-25">
                <p class="small text-white-50 mb-0">¿No tienes cuenta? 
                  <a routerLink="/componentes/autenticacion/sigin" class="text-primary text-decoration-none fw-bold ms-1">Regístrate</a>
                </p>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
