<div class="d-flex justify-content-center align-items-center min-vh-100 position-relative overflow-hidden py-4">
  
  <div class="container z-1">
    <div class="row justify-content-center align-items-center">
       <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4 col-xxl-3">
        
        <div class="text-center mb-4 mb-md-5">
          <div class="mb-3">
            <i class="bi bi-shield-lock display-2 text-primary"></i>
          </div>
          <h1 class="fs-2 fs-lg-1 fw-bold mb-3 text-uppercase text-white text-center">
            ¡Hola de <span class="text-primary">Nuevo</span>!
          </h1>
          <p class="text-white-50 small px-2 px-md-4 text-center">Introduce tus credenciales para acceder a tu panel</p>
        </div>

        <div class="card bg-dark bg-opacity-75 border border-secondary border-opacity-50 shadow-lg rounded-4 overflow-hidden">
          <div class="card-body p-4 p-sm-5">
            <form [formGroup]="loginForm" (ngSubmit)="login()">

              <div class="mb-4">
                <label for="email" class="form-label fw-semibold text-white small mb-2 tracking-wide">CORREO ELECTRÓNICO</label>
                <div class="input-group">
                  <span class="input-group-text bg-black border-secondary text-white-50 px-3">
                    <i class="bi bi-envelope fs-5"></i>
                  </span>
                  <input type="email" 
                    class="form-control form-control-lg bg-black text-white border-secondary shadow-none fs-6 py-2 py-md-3"
                    [class.border-danger]="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)"
                    id="email" 
                    placeholder="ejemplo@correo.com" 
                    formControlName="email"
                    autocomplete="email" />
                </div>

                <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)" 
                    class="alert alert-danger bg-transparent border-danger text-danger mt-2 py-2 small d-flex align-items-center gap-2 mb-0" 
                    role="alert">
                  <i class="bi bi-exclamation-circle"></i>
                  <div>
                    <span *ngIf="loginForm.get('email')?.hasError('required')">El correo es obligatorio.</span>
                    <span *ngIf="loginForm.get('email')?.hasError('email')">El formato no es válido.</span>
                  </div>
                </div>
              </div>

              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2 gap-2">
                  <label for="password" class="form-label fw-semibold text-white small mb-0 tracking-wide">CONTRASEÑA</label>
                  <a routerLink="/componentes/autenticacion/recuperar-password" class="text-primary text-decoration-none x-small fw-medium">
                    He olvidado la contraseña
                  </a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-black border-secondary text-white-50 px-3">
                    <i class="bi bi-key fs-5"></i>
                  </span>
                  <input [type]="showPassword ? 'text' : 'password'" 
                    class="form-control form-control-lg bg-black text-white border-secondary shadow-none fs-6 py-2 py-md-3"
                    [class.border-danger]="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)"
                    id="password" 
                    placeholder="Tu contraseña" 
                    formControlName="password"
                    autocomplete="current-password" />
                  <button type="button"
                    class="btn btn-outline-secondary border-secondary text-white-50"
                    (click)="togglePasswordVisibility()"
                    [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                    <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
                  </button>
                </div>

                <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" 
                    class="alert alert-danger bg-transparent border-danger text-danger mt-2 py-2 small d-flex align-items-center gap-2 mb-0" 
                    role="alert">
                  <i class="bi bi-exclamation-circle"></i>
                  <div>
                    <span *ngIf="loginForm.get('password')?.hasError('required')">La contraseña es obligatoria.</span>
                    <span *ngIf="loginForm.get('password')?.hasError('minlength')">Mínimo 8 caracteres.</span>
                  </div>
                </div>
              </div>

              <div *ngIf="errores" class="alert alert-danger bg-transparent border-danger text-danger mb-4 py-2 small d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-exclamation-octagon"></i>
                <span>{{ mensajeError }}</span>
              </div>

              <div class="d-grid gap-2 mb-4 mt-2">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill py-2 py-md-3 fw-bold shadow-sm text-uppercase tracking-wider fs-6"
                  [disabled]="loginForm.invalid || loading">
                  <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                  {{ loading ? 'ENTRANDO...' : 'INICIAR SESIÓN' }}
                </button>
              </div>

              <div class="d-flex align-items-center mb-4 mt-3">
                <hr class="flex-grow-1 text-white-50 opacity-25">
                <span class="px-3 text-white-50 small text-uppercase fw-medium opacity-75">O</span>
                <hr class="flex-grow-1 text-white-50 opacity-25">
              </div>

              <div class="d-grid gap-3">
                <button type="button"
                  class="btn btn-outline-light btn-lg rounded-pill d-flex align-items-center justify-content-center gap-3 py-2 py-md-3 border-secondary shadow-none google-btn fs-6"
                  (click)="loginWithGoogle()" [disabled]="loading">
                  <i class="bi bi-google fs-5"></i>
                  <span class="fw-medium">Google</span>
                </button>
              </div>

              <div class="text-center mt-4 mt-md-5 pt-3 border-top border-secondary border-opacity-25">
                <p class="small text-white-50 mb-0">¿No tienes cuenta? 
                  <a routerLink="/componentes/autenticacion/sigin" class="text-primary text-decoration-none fw-bold ms-1">Regístrate</a>
                </p>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
