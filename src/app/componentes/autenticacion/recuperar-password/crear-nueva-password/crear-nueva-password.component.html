<div class="d-flex justify-content-center align-items-center min-vh-100 position-relative overflow-hidden py-4">

    <div class="container z-1">
        <div class="row justify-content-center align-items-center">
            <div class="col-12 col-sm-9 col-md-8 col-lg-5 col-xl-4">

                <div class="text-center mb-4 mb-md-5">
                    <div class="mb-3">
                        <i class="bi bi-shield-lock display-2 text-primary"></i>
                    </div>
                    <h1 class="fs-2 fs-lg-1 fw-bold mb-3 text-uppercase text-white">
                        Nueva <span class="text-primary">Seguridad</span>
                    </h1>
                    <p class="text-white-50 small px-2">Crea una contraseña fuerte para proteger tu cuenta</p>
                </div>

                <div class="card bg-dark bg-opacity-75 border border-secondary border-opacity-50 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-4 p-sm-5">
                        <form (ngSubmit)="cambiarContrasena()" #formulario="ngForm">

                            <div class="mb-4">
                                <label for="nuevaContrasena" class="form-label fw-semibold text-white small mb-2 tracking-wide text-uppercase">Nueva Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-black border-secondary text-white-50 px-3">
                                        <i class="bi bi-key fs-5"></i>
                                    </span>
                                    <input [type]="mostrarNueva ? 'text' : 'password'"
                                        class="form-control form-control-lg bg-black text-white border-secondary shadow-none fs-6 py-3"
                                        id="nuevaContrasena" placeholder="Mínimo 8 caracteres" required minlength="8"
                                        [(ngModel)]="nuevaContrasena" name="nuevaContrasena" #nuevaRef="ngModel" />
                                    <button type="button" class="btn btn-outline-secondary border-secondary bg-black text-white-50"
                                        (click)="mostrarNueva = !mostrarNueva">
                                        <i class="bi" [ngClass]="mostrarNueva ? 'bi-eye-slash' : 'bi-eye'"></i>
                                    </button>
                                </div>
                                <div *ngIf="nuevaRef.invalid && nuevaRef.touched" class="alert alert-danger bg-transparent border-danger text-danger mt-2 py-2 small d-flex align-items-center gap-2 mb-0">
                                    <i class="bi bi-exclamation-circle"></i>
                                    <span>Mínimo 8 caracteres requeridos.</span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmarContrasena" class="form-label fw-semibold text-white small mb-2 tracking-wide text-uppercase">Confirmar Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-black border-secondary text-white-50 px-3">
                                        <i class="bi bi-check2-all fs-5"></i>
                                    </span>
                                    <input [type]="mostrarConfirmar ? 'text' : 'password'"
                                        class="form-control form-control-lg bg-black text-white border-secondary shadow-none fs-6 py-3"
                                        id="confirmarContrasena" placeholder="Repite tu contraseña" required
                                        [(ngModel)]="confirmarContrasena" name="confirmarContrasena" />
                                    <button type="button" class="btn btn-outline-secondary border-secondary bg-black text-white-50"
                                        (click)="mostrarConfirmar = !mostrarConfirmar">
                                        <i class="bi" [ngClass]="mostrarConfirmar ? 'bi-eye-slash' : 'bi-eye'"></i>
                                    </button>
                                </div>
                                <div *ngIf="confirmarContrasena && nuevaContrasena !== confirmarContrasena" class="alert alert-warning bg-transparent border-warning text-warning mt-2 py-2 small d-flex align-items-center gap-2 mb-0">
                                    <i class="bi bi-exclamation-triangle"></i>
                                    <span>Las contraseñas no coinciden.</span>
                                </div>
                            </div>

                            <div class="d-grid gap-2 mb-4 mt-2">
                                <button type="submit"
                                    class="btn btn-primary btn-lg rounded-pill py-3 fw-bold shadow-sm text-uppercase tracking-wider fs-6"
                                    [disabled]="cargando || !formulario.valid || nuevaContrasena !== confirmarContrasena">
                                    <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
                                    {{ cargando ? 'Guardando...' : 'Actualizar Contraseña' }}
                                </button>
                            </div>

                            <div *ngIf="mensaje" class="alert alert-success bg-transparent border-success text-success py-2 small d-flex align-items-center gap-2 mb-3">
                                <i class="bi bi-check-circle"></i>
                                <span>{{ mensaje }}</span>
                            </div>

                            <div *ngIf="mensajeError" class="alert alert-danger bg-transparent border-danger text-danger py-2 small d-flex align-items-center gap-2 mb-3">
                                <i class="bi bi-exclamation-octagon"></i>
                                <span>{{ mensajeError }}</span>
                            </div>

                            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                                <a routerLink="/componentes/autenticacion/login" class="text-primary text-decoration-none fw-bold small text-uppercase">
                                    <i class="bi bi-arrow-left me-1"></i> Volver al login
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
