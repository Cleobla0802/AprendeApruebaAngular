<div class="d-flex justify-content-center align-items-center min-vh-100 text-white position-relative overflow-hidden">
    <!-- Imágenes decorativas de fondo -->
    <img src="/assets/Vector4.png" class="position-absolute bottom-0 start-0 decorative-img" />
    <img src="/assets/Vector3.png" class="position-absolute top-0 end-0 decorative-img" />

    <!-- Contenedor principal -->
    <div class="container py-3 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <!-- Título principal -->
                <div class="text-center mb-4 mb-md-5">
                    <h1 class="display-5 fw-bold mb-3">Cambiar contraseña</h1>
                    <p class="text-white-50 fs-6">
                        Introduce tu contraseña actual y luego la nueva contraseña que deseas establecer
                    </p>
                </div>

                <!-- Card del formulario -->
                <div class="card card-bg-gradient bg-opacity-75 border-0 shadow-lg rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <form (ngSubmit)="cambiarContrasena()" #formulario="ngForm">

                            <!-- Campo contraseña actual -->
                            <div class="mb-4">
                                <label for="contrasenaActual" class="form-label fw-semibold">Contraseña actual</label>
                                <div class="input-group">
                                    <input
                                        [type]="mostrarActual ? 'text' : 'password'"
                                        class="form-control form-control-lg rounded-start-3 bg-dark text-white border-secondary"
                                        id="contrasenaActual"
                                        placeholder="Introduce tu contraseña actual"
                                        required
                                        [(ngModel)]="contrasenaActual"
                                        name="contrasenaActual"
                                        aria-label="Contraseña actual" />
                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary bg-dark border-secondary text-white rounded-end-3"
                                        (click)="mostrarActual = !mostrarActual"
                                        aria-label="Mostrar u ocultar contraseña actual">
                                        <i class="bi" [ngClass]="mostrarActual ? 'bi-eye-slash' : 'bi-eye'"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Campo nueva contraseña -->
                            <div class="mb-4">
                                <label for="nuevaContrasena" class="form-label fw-semibold">Nueva contraseña</label>
                                <div class="input-group">
                                    <input
                                        [type]="mostrarNueva ? 'text' : 'password'"
                                        class="form-control form-control-lg rounded-start-3 bg-dark text-white border-secondary"
                                        id="nuevaContrasena"
                                        placeholder="Mínimo 8 caracteres"
                                        required
                                        minlength="8"
                                        [(ngModel)]="nuevaContrasena"
                                        name="nuevaContrasena"
                                        #nuevaRef="ngModel"
                                        aria-label="Nueva contraseña" />
                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary bg-dark border-secondary text-white rounded-end-3"
                                        (click)="mostrarNueva = !mostrarNueva"
                                        aria-label="Mostrar u ocultar nueva contraseña">
                                        <i class="bi" [ngClass]="mostrarNueva ? 'bi-eye-slash' : 'bi-eye'"></i>
                                    </button>
                                </div>
                                <div *ngIf="nuevaRef.invalid && nuevaRef.touched" class="form-text text-danger mt-1">
                                    La contraseña debe tener al menos 8 caracteres.
                                </div>
                            </div>

                            <!-- Campo confirmar nueva contraseña -->
                            <div class="mb-4">
                                <label for="confirmarContrasena" class="form-label fw-semibold">Confirmar nueva contraseña</label>
                                <div class="input-group">
                                    <input
                                        [type]="mostrarConfirmar ? 'text' : 'password'"
                                        class="form-control form-control-lg rounded-start-3 bg-dark text-white border-secondary"
                                        id="confirmarContrasena"
                                        placeholder="Repite la nueva contraseña"
                                        required
                                        [(ngModel)]="confirmarContrasena"
                                        name="confirmarContrasena"
                                        aria-label="Confirmar nueva contraseña" />
                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary bg-dark border-secondary text-white rounded-end-3"
                                        (click)="mostrarConfirmar = !mostrarConfirmar"
                                        aria-label="Mostrar u ocultar confirmación de contraseña">
                                        <i class="bi" [ngClass]="mostrarConfirmar ? 'bi-eye-slash' : 'bi-eye'"></i>
                                    </button>
                                </div>
                                <div *ngIf="confirmarContrasena && nuevaContrasena !== confirmarContrasena" class="form-text text-danger mt-1">
                                    Las contraseñas no coinciden.
                                </div>
                            </div>

                            <!-- Botón de guardar -->
                            <div class="d-grid mb-4">
                                <button type="submit"
                                    class="btn btn-primary btn-lg rounded-3 py-3 fw-semibold shadow-sm w-100"
                                    [disabled]="cargando || !formulario.valid || nuevaContrasena !== confirmarContrasena">
                                    <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
                                    {{ cargando ? 'Guardando...' : 'Guardar nueva contraseña' }}
                                </button>
                            </div>

                            <!-- Mensaje de éxito -->
                            <div *ngIf="mensaje"
                                class="alert alert-success alert-dismissible fade show text-center rounded-3"
                                role="alert">
                                {{ mensaje }}
                                <button type="button" class="btn-close" aria-label="Close"
                                    (click)="mensaje = ''"></button>
                            </div>

                            <!-- Mensaje de error -->
                            <div *ngIf="mensajeError"
                                class="alert alert-danger alert-dismissible fade show text-center rounded-3"
                                role="alert">
                                {{ mensajeError }}
                                <button type="button" class="btn-close" aria-label="Close"
                                    (click)="mensajeError = ''"></button>
                            </div>

                            <div class="text-center mt-3">
                                <a routerLink="/componentes/autenticacion/login" class="text-decoration-none text-primary-emphasis">
                                    Volver al login
                                </a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
