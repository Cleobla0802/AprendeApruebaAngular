<div class="d-flex justify-content-center align-items-center min-vh-100 text-white position-relative overflow-hidden">
    <!-- Imágenes decorativas de fondo -->
    <img src="/assets/Vector4.png" class="position-absolute bottom-0 start-0 decorative-img" />
    <img src="/assets/Vector3.png" class="position-absolute top-0 end-0 decorative-img" />

    <!-- Contenedor principal -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <!-- Título principal -->
                <div class="text-center mb-5">
                    <h1 class="display-5 fw-bold mb-3">Recuperar contraseña</h1>
                    <p class="text-white-50 fs-6">
                        Introduce tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña
                    </p>
                </div>

                <!-- Card del formulario -->
                <div class="card card-bg-gradient bg-opacity-75 border-0 shadow-lg rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <form (ngSubmit)="enviarEmail()" #formulario="ngForm">

                            <!-- Campo de email -->
                            <div class="mb-4">
                                <label for="email" class="form-label fw-semibold">Correo electrónico</label>
                                <input type="email"
                                    class="form-control form-control-lg rounded-3 bg-dark text-white border-secondary"
                                    id="email" placeholder="ejemplo@correo.com" required [(ngModel)]="email"
                                    name="email" aria-label="Correo electrónico" />
                            </div>

                            <!-- Botón de enviar -->
                            <div class="d-grid mb-4">
                                <button type="submit"
                                    class="btn btn-primary btn-lg rounded-3 py-3 fw-semibold shadow-sm w-100"
                                    [disabled]="cargando">
                                    <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
                                    {{ cargando ? 'Enviando...' : 'Restaurar contraseña' }}
                                </button>
                            </div>

                            <!-- Mensaje de éxito -->
                            <div *ngIf="mostrarAlert"
                                class="alert alert-success alert-dismissible fade show text-center rounded-3"
                                role="alert">
                                {{ mensaje }}
                                <button type="button" class="btn-close" aria-label="Close"
                                    (click)="mostrarAlert = false"></button>
                            </div>


                            <!-- Mensaje de éxito -->
                            <div *ngIf="mensaje" class="alert alert-success text-center rounded-3">
                                {{ mensaje }}
                            </div>

                            <div class="text-center mt-3">
                                <a routerLink="/login" class="text-decoration-none text-primary-emphasis">
                                    Volver al login
                                </a>
                            </div>
