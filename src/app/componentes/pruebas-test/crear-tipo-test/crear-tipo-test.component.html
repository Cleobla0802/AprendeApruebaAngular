<div class="container py-3 py-md-5">
  <div class="text-center mb-4 mb-md-5">
    <h1 class="display-6 display-md-5 fw-bold text-white text-uppercase">Creacion de tipo test</h1>
    <p class="text-secondary">Selecciona el material para crear su tipo tes, apunte o resumen como prefiera</p>
  </div>

  <div class="row justify-content-center mb-4 mb-md-5">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="btn-group w-100 shadow-sm border border-secondary border-opacity-25 rounded-pill overflow-hidden" role="group">
        <input type="radio" class="btn-check" name="tab" id="tab1" checked (click)="tabActiva = 'apuntes'; seleccionado = null">
        <label class="btn btn-outline-primary py-2 py-md-3 fw-bold border-0" for="tab1">
          <i class="bi bi-journal-text me-2"></i>APUNTES
        </label>

        <input type="radio" class="btn-check" name="tab" id="tab2" (click)="tabActiva = 'resumenes'; seleccionado = null">
        <label class="btn btn-outline-primary py-2 py-md-3 fw-bold border-0" for="tab2">
          <i class="bi bi-file-earmark-text me-2"></i>RESÚMENES
        </label>
      </div>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-4 mb-md-5">
    
    <div class="col-12 text-center py-5" *ngIf="cargando">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-secondary mt-3">Cargando material disponible...</p>
    </div>

    <div class="col" *ngFor="let item of getListaActual()">
      <div (click)="seleccionar(item)"
           class="card h-100 bg-dark text-white shadow-sm border-2 rounded-4 user-select-none cursor-pointer"
           [class.border-primary]="seleccionado?.id === item.id"
           [class.border-secondary]="seleccionado?.id !== item.id"
           [class.opacity-50]="seleccionado && seleccionado.id !== item.id"
           role="button">
        
        <div class="card-body p-4 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span [class]="'badge rounded-pill px-3 py-2 bg-' + getBgColor(item.categoria) + ' bg-opacity-10 text-' + getBgColor(item.categoria)">
              {{ (item.categoria || 'Sin categoría') | titlecase }}
            </span>
            <i class="bi fs-5" 
               [class.bi-check-circle-fill]="seleccionado?.id === item.id"
               [class.text-primary]="seleccionado?.id === item.id"
               [class.bi-circle]="seleccionado?.id !== item.id"
               [class.text-secondary]="seleccionado?.id !== item.id"></i>
          </div>

          <h5 class="card-title fw-bold mb-2">{{ item.titulo }}</h5>
          
          <p class="card-text text-secondary small flex-grow-1 opacity-75">
            {{ item.descripcion || (item.contenido | slice:0:100) + '...' }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="fixed-bottom py-2 py-md-4 bg-dark border-top border-secondary border-opacity-25 shadow-lg z-3" *ngIf="seleccionado">
    <div class="container d-flex justify-content-center px-3">
      <button class="btn btn-primary btn-lg rounded-pill px-4 px-md-5 shadow fw-bold text-uppercase tracking-wider w-100 w-md-auto" 
              (click)="generarTest()" 
              [disabled]="generando">
        <span *ngIf="generando" class="spinner-border spinner-border-sm me-2" role="status"></span>
        {{ generando ? 'Generando Examen...' : 'Crear Test: ' + seleccionado.titulo }}
      </button>
    </div>
  </div>
</div>
