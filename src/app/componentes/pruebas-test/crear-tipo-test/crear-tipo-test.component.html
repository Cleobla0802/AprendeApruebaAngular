<div class="container py-5">
  <div class="text-center mb-5">
    <h1 class="display-5 fw-bold text-white">Generador de Tests</h1>
    <p class="text-secondary">Elige un material para que la IA cree tu examen</p>
  </div>

  <div class="row justify-content-center mb-4">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="btn-group w-100 shadow-sm" role="group">
        <input type="radio" class="btn-check" name="tab" id="tab1" checked (click)="tabActiva = 'apuntes'; seleccionado = null">
        <label class="btn btn-outline-primary py-2 fw-semibold" for="tab1">
          <i class="bi bi-journal-text me-2"></i>Apuntes
        </label>

        <input type="radio" class="btn-check" name="tab" id="tab2" (click)="tabActiva = 'resumenes'; seleccionado = null">
        <label class="btn btn-outline-primary py-2 fw-semibold" for="tab2">
          <i class="bi bi-file-earmark-text me-2"></i>Resúmenes
        </label>
      </div>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    
    <div class="col-12 text-center py-5" *ngIf="cargando">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>

    <div class="col" *ngFor="let item of getListaActual()">
      <div 
        (click)="seleccionar(item)"
        class="card h-100 bg-dark text-white shadow-sm border-2 user-select-none"
        [class.border-primary]="seleccionado?.id === item.id"
        [class.border-secondary]="seleccionado?.id !== item.id"
        [class.opacity-75]="seleccionado && seleccionado.id !== item.id">
        
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span [class]="'badge rounded-pill bg-' + getBgColor(item.categoria)">
              {{ item.categoria | titlecase }}
            </span>
            <i class="bi fs-5" 
               [class.bi-check-circle-fill]="seleccionado?.id === item.id"
               [class.text-primary]="seleccionado?.id === item.id"
               [class.bi-circle]="seleccionado?.id !== item.id"
               [class.text-secondary]="seleccionado?.id !== item.id"></i>
          </div>

          <h5 class="card-title fw-bold mb-2">{{ item.titulo }}</h5>
          
          <p class="card-text text-secondary small text-truncate">
            {{ item.contenido }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="sticky-bottom py-4 mt-5 bg-dark border-top border-secondary border-opacity-25" *ngIf="seleccionado">
    <div class="container d-flex justify-content-center">
      <button class="btn btn-primary btn-lg rounded-pill px-5 shadow-lg fw-bold" 
              (click)="generarTest()" 
              [disabled]="generando">
        <span *ngIf="generando" class="spinner-border spinner-border-sm me-2" role="status"></span>
        {{ generando ? 'Generando...' : 'Crear Test de: ' + seleccionado.titulo }}
      </button>
    </div>
  </div>
</div>
