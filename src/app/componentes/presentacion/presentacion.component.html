<div class="container text-white text-center py-3 py-md-5">
    <img class="my-3 my-md-5 img-fluid" src="/assets/logoTfg.png" alt="Logo">

    <p class="mt-3 mt-md-5 fs-5 px-3 px-md-5">
        <span class="fw-bold">Aprende & Aprueba</span> te ayudará a aprobar este año
        de la forma más fácil y rápida jamás vista
    </p>

    <p class="text-info fs-4 mt-3 mt-md-5 fw-semibold">Somos tu mejor maestro</p>

    <p class="opacity-50 mt-3 mt-md-5 mb-3 mb-md-5 fs-5">
        Te ayudaremos a mejorar tu capacidad de aprendizaje un 200%
    </p>

    <div class="row justify-content-center g-3 mt-3 mt-md-5 mb-3 mb-md-5" *ngIf="!estaAutenticado; else accesoPrivado">
        <div class="col-12 col-sm-auto">
            <a routerLink="/componentes/autenticacion/login"
               class="btn btn-primary btn-lg rounded-pill px-4 px-md-5 py-2 py-md-3 fs-5 shadow-lg fw-bold w-100">
                Iniciar sesión
            </a>
        </div>
        <div class="col-12 col-sm-auto">
            <a routerLink="/componentes/autenticacion/sigin"
               class="btn btn-outline-light btn-lg rounded-pill px-4 px-md-5 py-2 py-md-3 fs-5 shadow-lg fw-bold w-100">
                Sign in
            </a>
        </div>
    </div>

    <ng-template #accesoPrivado>
        <button
            type="button"
            class="btn btn-primary btn-lg rounded-pill px-4 px-md-5 py-2 py-md-3 fs-5 mt-3 mt-md-5 mb-3 mb-md-5 shadow-lg fw-bold"
            (click)="navegarSegunEstado()">
            Ir a mis apuntes
        </button>
    </ng-template>
</div>
