<div *ngIf="notif.show" 
     class="alert alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow-lg z-3 alert-{{notif.type}}" 
     role="alert">
  <div class="d-flex align-items-center gap-2">
    <i class="bi" [ngClass]="notif.type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'"></i>
    <span>{{ notif.msg }}</span>
    <button type="button" class="btn-close" (click)="notif.show = false"></button>
  </div>
</div>

<div class="container-fluid py-5 text-light" *ngIf="!cargando && resumen">

  <div class="mb-5 d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div>
      <h1 class="display-5 fw-bold text-white mb-2">Editor de Resumen</h1>
      <p class="text-secondary mb-0">
        Personaliza el contenido generado por la IA
      </p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary rounded-pill px-4 shadow-sm fw-bold" (click)="volver()">
        <i class="bi bi-arrow-left me-2"></i>Volver
      </button>
      <button class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold" (click)="guardar()">
        <i class="bi bi-cloud-arrow-up me-2"></i>Guardar cambios
      </button>
    </div>
  </div>

  <div class="row g-4">

    <div class="col-lg-4">
      <div class="card bg-dark border-secondary rounded-4 shadow-sm h-100">
        <div class="card-header border-secondary bg-secondary bg-opacity-10 p-4">
          <h5 class="mb-0 fw-bold text-white">Detalles</h5>
        </div>

        <div class="card-body p-4">
          <div class="mb-4">
            <label class="form-label small fw-bold text-secondary mb-2 text-uppercase">Título</label>
            <input type="text" [(ngModel)]="resumen.titulo" class="form-control bg-black text-white border-secondary shadow-none">
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-secondary mb-2 text-uppercase">Categoría</label>
            <div>
              <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 rounded-pill px-3 py-2">
                {{ resumen.categoria || 'Sin categoría' | titlecase }}
              </span>
            </div>
          </div>

          <div class="mb-0">
            <label class="form-label small fw-bold text-secondary mb-2 text-uppercase">Creación</label>
            <p class="text-white-50 small mb-0">
              {{ resumen.fecha | date:'dd/MM/yyyy HH:mm' }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card bg-black border-secondary rounded-4 shadow-sm overflow-hidden">
        
        <div class="card-header bg-dark border-secondary py-4">
          </div>

          <textarea 
            [(ngModel)]="resumen.contenido"
            class="form-control bg-transparent text-white border-0 p-4 shadow-none overflow-auto" 
            rows="18"
            placeholder="Escribe aquí tu resumen...">
          </textarea>

        <div class="card-footer bg-dark border-secondary d-flex justify-content-between align-items-center p-3 text-secondary">
          <span class="small">{{ resumen.contenido?.split(' ').length || 0 }} palabras</span>
        </div>

      </div>
    </div>

  </div>
</div>

<div class="container-fluid min-vh-100 d-flex flex-column align-items-center justify-content-center" *ngIf="cargando">
  <div class="spinner-border text-primary mb-3" role="status"></div>
  <p class="text-secondary fw-bold">Cargando resumen...</p>
</div>
