<div class="container-fluid min-vh-100 py-5" *ngIf="!cargando && resumen">

  <div class="mb-5 d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div>
      <h1 class="display-5 fw-bold text-white mb-2">Editor de Resumen</h1>
      <p class="text-secondary mb-0">
        <i class="bi bi-pencil-square me-2"></i>
        Personaliza el contenido generado por la IA
      </p>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-outline-secondary rounded-pill px-4 shadow-sm" (click)="router.navigate(['/componentes/resumenes'])">
        <i class="bi bi-arrow-left me-2"></i>Volver
      </button>
      <button class="btn btn-primary rounded-pill px-4 shadow-sm" (click)="guardarCambios()" [disabled]="guardando">
        <span *ngIf="guardando" class="spinner-border spinner-border-sm me-2"></span>
        <i *ngIf="!guardando" class="bi bi-save me-2"></i>
        {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </div>
  </div>

  <div class="row g-4">

    <div class="col-lg-4">
      <div class="card bg-secondary bg-opacity-10 text-white rounded-4 shadow-lg overflow-hidden">
        <div class="card-header bg-secondary bg-opacity-25 d-flex align-items-center p-4">
          <i class="bi bi-info-circle-fill me-2 fs-5"></i>
          <h5 class="mb-0 fw-semibold">Información del resumen</h5>
        </div>

        <div class="card-body p-4">
          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary mb-2">Título</label>
            <input type="text" [(ngModel)]="resumen.titulo" class="form-control bg-dark text-white border-secondary">
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary mb-2">Categoría</label>
            <p class="mb-0">
              <span class="badge text-bg-primary bg-opacity-25 rounded-pill px-3">
                {{ resumen.categoria || 'Sin categoría' | titlecase }}
              </span>
            </p>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary mb-2">Fecha de creación</label>
            <p class="text-white small">{{ resumen.fecha | date:'dd/MM/yyyy HH:mm' }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card bg-dark text-white rounded-4 shadow-lg overflow-hidden">
        
        <div class="d-flex flex-wrap gap-3 p-4 border-bottom border-secondary border-opacity-25">
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-outline-light rounded-2 shadow-sm"><i class="bi bi-type-bold"></i></button>
            <button class="btn btn-outline-light rounded-2 shadow-sm"><i class="bi bi-type-italic"></i></button>
            <button class="btn btn-outline-light rounded-2 shadow-sm"><i class="bi bi-list-ul"></i></button>
          </div>
          <span class="ms-auto text-success small" *ngIf="!guardando && !cargando">
            <i class="bi bi-cloud-check me-1"></i>Sincronizado
          </span>
        </div>

        <div class="p-0">
          <textarea 
            [(ngModel)]="resumen.contenido"
            class="form-control bg-transparent text-white border-0 p-4" 
            style="min-height:500px; font-size:1rem; line-height:1.7; outline: none; box-shadow: none;"
            placeholder="Escribe aquí tu resumen...">
          </textarea>
        </div>

        <div class="d-flex justify-content-between align-items-center p-3 text-secondary border-top border-secondary border-opacity-25">
          <span><i class="bi bi-file-text me-1"></i>{{ contarPalabras }} palabras</span>
          <div class="small">ID: {{ resumen.id }}</div>
        </div>

      </div>
    </div>

  </div>
</div>

<div class="container py-5 text-center" *ngIf="cargando">
  <div class="spinner-border text-primary" role="status"></div>
  <p class="text-secondary mt-3">Cargando contenido...</p>
</div>
