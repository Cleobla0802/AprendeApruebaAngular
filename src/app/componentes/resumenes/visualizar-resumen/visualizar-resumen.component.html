<div *ngIf="notif.show"
     class="alert alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow-lg alert-{{notif.type}} z-3"
     role="alert">
  <div class="d-flex align-items-center gap-2">
    <i class="bi" [ngClass]="notif.type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'"></i>
    <span>{{ notif.msg }}</span>
    <button type="button" class="btn-close" (click)="notif.show = false"></button>
  </div>
</div>

<div class="container-fluid py-3 py-md-5 container-xxl" *ngIf="!cargando && resumen; else cargandoTemplate">
  <div class="row g-4">

    <div class="col-12 col-lg-4 col-xl-3">
      <div class="card bg-secondary bg-opacity-10 text-white rounded-4 border-0 shadow">
        <div class="card-body p-4">

          <div class="mb-4">
            <label class="form-label small fw-bold text-white text-uppercase">Titulo</label>
            <input type="text" class="form-control bg-dark text-white border-secondary shadow-none"
                   [(ngModel)]="resumen.titulo">
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-white text-uppercase">Categoria</label>
            <select class="form-select bg-dark text-white border-secondary shadow-none" [(ngModel)]="resumen.categoria">
              <option *ngFor="let cat of categorias" [value]="cat.valor">{{ cat.nombre }}</option>
            </select>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-white text-uppercase">Descripcion</label>
            <textarea class="form-control bg-dark text-white border-secondary shadow-none"
                      rows="4" maxlength="150" [(ngModel)]="resumen.descripcion"></textarea>
            <div class="d-flex justify-content-end mt-1">
              <small [ngClass]="(resumen.descripcion?.length || 0) >= 150 ? 'text-danger' : 'text-white'">
                {{ resumen.descripcion?.length || 0 }}/150
              </small>
            </div>
          </div>

          <div class="mt-2 pt-3 border-top border-secondary border-opacity-25">
            <div class="d-flex align-items-center text-secondary small opacity-75 mb-3">
              <i class="bi bi-calendar3 me-2"></i>
              <span class="text-white">Creado el {{ resumen.fecha | date:'dd MMM, yyyy' }}</span>
            </div>
            <button class="btn btn-primary w-100 rounded-pill mb-2" (click)="guardar()" [disabled]="guardando">
              <span *ngIf="guardando" class="spinner-border spinner-border-sm me-2"></span>
              Guardar Cambios
            </button>
            <button class="btn btn-outline-primary w-100 rounded-pill" (click)="volver()">
              Volver
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-8 col-xl-9 col-xxl-10 d-flex">
      <div class="card bg-dark text-white rounded-4 border-secondary shadow overflow-hidden w-100">
        <div class="bg-black bg-opacity-50 p-3 border-bottom border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
          <small class="fw-bold text-primary text-uppercase ms-2">Contenido del Resumen</small>
          <span class="badge bg-dark border border-secondary border-opacity-25 text-white fw-normal">
            {{ resumen.resumenTexto?.split(' ').length || 0 }} palabras
          </span>
        </div>
        <textarea [(ngModel)]="resumen.resumenTexto"
                  class="form-control bg-transparent text-white border-0 p-4 shadow-none flex-grow-1 h-100 custom-scrollbar"
                  rows="20"
                  placeholder="El contenido generado aparecera aqui..."></textarea>
      </div>
    </div>

  </div>
</div>

<ng-template #cargandoTemplate>
  <div class="d-flex flex-column align-items-center justify-content-center py-5 min-vh-100">
    <div class="spinner-border text-primary mb-3" role="status"></div>
    <p class="text-secondary">Cargando resumen...</p>
  </div>
</ng-template>
