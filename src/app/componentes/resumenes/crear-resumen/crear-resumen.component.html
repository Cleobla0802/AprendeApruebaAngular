<div class="container-fluid py-4">
  
  <div class="mb-5">
    <label class="form-label fw-semibold text-light mb-3">
      <i class="bi bi-journals text-primary me-2"></i>
      Selecciona los apuntes
    </label>

    <div class="d-flex gap-2 mb-4">
      <div class="input-group flex-grow-1">
        <span class="input-group-text bg-black border-secondary text-secondary">
          <i class="bi bi-search"></i>
        </span>
        <input type="text" class="form-control bg-black text-light border-secondary" placeholder="Buscar apuntes...">
      </div>
      <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 rounded-3 px-3 d-flex align-items-center gap-1 fs-6">
        <i class="bi bi-check2-square"></i> {{ seleccionados.length }} seleccionados
      </span>
    </div>

    <div *ngIf="cargando" class="text-center my-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-secondary mt-2">Cargando tus apuntes...</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" *ngIf="!cargando && listaApuntes.length > 0">
      <div class="col" *ngFor="let apunte of listaApuntes">
        <input type="checkbox" class="btn-check" [id]="'apunte-' + apunte.id" (change)="toggleSeleccion(apunte)">
        <label [for]="'apunte-' + apunte.id" class="card h-100 bg-dark border-primary border-opacity-25 text-decoration-none text-reset shadow w-100 cursor-pointer">
          <div class="card-body">
             <div class="d-flex justify-content-between mb-2">
                <span class="badge text-bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25">{{apunte.categoria}}</span>
                <i class="bi" [ngClass]="seleccionados.includes(apunte) ? 'bi-check-circle-fill text-primary' : 'bi-circle text-secondary'"></i>
             </div>
             <h5 class="text-white fw-bold">{{ apunte.titulo }}</h5>
             <p class="text-secondary small">{{ apunte.contenido | slice:0:80 }}...</p>
          </div>
        </label>
      </div>
    </div>

    <div *ngIf="!cargando && listaApuntes.length === 0" class="alert alert-dark border-secondary text-center py-5">
      <i class="bi bi-inbox fs-1 d-block mb-3 opacity-50"></i>
      No tienes apuntes disponibles para resumir.
    </div>
  </div>

  <div class="row pt-4 border-top border-secondary border-opacity-25">
    
    <div class="col-lg-4">
      <h5 class="text-white mb-3">Configuración del Resumen</h5>
      <div class="card bg-dark border-secondary p-4">
        <div class="mb-4">
          <label class="form-label text-secondary small fw-bold">Categoría del Resumen</label>
          <div class="d-flex gap-2">
            <select class="form-select bg-black text-light border-secondary" [(ngModel)]="nuevaCategoria">
              <option value="" disabled selected>Selecciona una categoría</option>
              <option *ngFor="let cat of categorias" [value]="cat.valor">{{ cat.nombre }}</option>
            </select>
            <button class="btn btn-outline-primary" (click)="toggleCrearCategoria()">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
        </div>

        <button class="btn btn-primary w-100 py-3 d-flex align-items-center justify-content-center gap-2"
                [disabled]="seleccionados.length === 0 || generandoIA"
                (click)="crearResumen()">
          <span *ngIf="generandoIA" class="spinner-border spinner-border-sm"></span>
          <i *ngIf="!generandoIA" class="bi bi-stars"></i>
          {{ generandoIA ? 'Generando...' : 'Generar Resumen' }}
        </button>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="text-white m-0">Resultado del Resumen</h5>
        <button *ngIf="resumenResultado" class="btn btn-sm btn-success" (click)="guardarResumenFinal()">
          <i class="bi bi-save me-1"></i> Guardar en Biblioteca
        </button>
      </div>
      
      <div class="card bg-black border-secondary" style="min-height: 300px;">
        <div class="card-body p-0 d-flex flex-column">
          <div *ngIf="!resumenResultado && !generandoIA" class="m-auto text-center text-secondary opacity-50 p-5">
            <i class="bi bi-robot display-4 mb-3"></i>
            <p>Selecciona tus apuntes arriba y pulsa "Generar"</p>
          </div>

          <textarea *ngIf="resumenResultado" 
                    class="form-control bg-transparent text-light border-0 p-4 flex-grow-1"
                    [(ngModel)]="resumenResultado"
                    style="min-height: 300px; resize: none;"></textarea>
        </div>
      </div>
    </div>

  </div>
</div>
