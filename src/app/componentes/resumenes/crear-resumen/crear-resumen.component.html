<div *ngIf="notif.show" 
     class="alert alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow-lg z-3 alert-{{notif.type}}" 
     role="alert">
  <div class="d-flex align-items-center gap-2">
    <i class="bi" [ngClass]="notif.type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'"></i>
    <span>{{ notif.msg }}</span>
    <button type="button" class="btn-close" (click)="notif.show = false"></button>
  </div>
</div>

<div class="container-fluid py-4 text-light">
  
  <div class="mb-4 d-flex justify-content-between align-items-center">
    <div>
      <h4 class="m-0 text-primary fw-bold">Crear Resúmenes</h4>
      <p class="text-secondary small mb-0">Selecciona los apuntes que quieres resumir</p>
    </div>
    <span class="badge rounded-pill bg-primary px-3 shadow-sm">{{ seleccionados.length }} seleccionados</span>
  </div>
    
  <div class="row g-3 mb-5 p-2 bg-dark bg-opacity-25 rounded-3">
    <div *ngIf="cargando" class="col-12 text-center py-5">
      <div class="spinner-border text-primary"></div>
    </div>
    
    <div class="col-12 col-md-6 col-xl-4" *ngFor="let a of listaApuntes">
      <div class="card bg-dark border-secondary h-100" 
          [class.border-primary]="seleccionados.includes(a)"
          (click)="toggle(a)"
          role="button">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge bg-secondary bg-opacity-25 text-secondary text-uppercase small">{{a.categoria}}</span>
            <i class="bi" 
              [class.bi-check-circle-fill]="seleccionados.includes(a)" 
              [class.text-primary]="seleccionados.includes(a)"
              [class.bi-circle]="!seleccionados.includes(a)"></i>
          </div>
          <h6 class="card-title fw-bold text-white">{{a.titulo}}</h6>
          <p class="card-text small text-secondary text-truncate">{{a.contenido}}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4 border-top border-secondary pt-4">
    
    <div class="col-lg-4">
      <div class="card bg-dark border-secondary p-4 shadow rounded-4">
        <h6 class="text-white mb-4 fw-bold">
          <i class="bi bi-sliders me-2 text-primary"></i>Configuración del Resumen
        </h6>
        
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">TÍTULO</label>
          <input type="text" 
                 class="form-control bg-black text-light border-secondary shadow-none" 
                 placeholder="Ej: Resumen Tema 1..." 
                 [(ngModel)]="nuevoTitulo">
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-secondary">CATEGORÍA</label>
          <select class="form-select bg-black text-light border-secondary shadow-none" [(ngModel)]="nuevaCategoria">
            <option value="" disabled selected>Elegir categoría...</option>
            <option *ngFor="let c of categorias" [value]="c.valor">{{c.nombre}}</option>
          </select>
        </div>
        
        <button class="btn btn-primary w-100 fw-bold py-3 rounded-pill shadow" 
                [disabled]="!seleccionados.length || generandoIA" 
                (click)="crearResumen()">
          <span *ngIf="generandoIA" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!generandoIA" class="bi bi-cpu me-2"></i>
          {{ generandoIA ? 'Generando...' : 'Procesar' }}
        </button>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card bg-black border-secondary rounded-4 shadow-lg">
        <div class="card-header border-secondary d-flex justify-content-between align-items-center bg-dark py-3">
          <span class="small fw-bold text-secondary text-uppercase">Resultado</span>
          
          <div class="d-flex gap-2" *ngIf="resumenResultado">
            <button class="btn btn-sm btn-outline-danger rounded-pill px-3" (click)="limpiarResultado()">
              <i class="bi bi-trash3 me-1"></i>Limpiar
            </button>
            <button class="btn btn-sm btn-success fw-bold px-4 rounded-pill shadow-sm" (click)="guardar()">
              <i class="bi bi-save2-fill me-2"></i>Guardar Cambios
            </button>
          </div>
        </div>
        
        <textarea [(ngModel)]="resumenResultado" 
                  class="form-control bg-transparent text-light border-0 p-4 shadow-none" 
                  rows="15"
                  placeholder="El resumen aparecera aqui..."></textarea>
      </div>
    </div>

  </div>
</div>
