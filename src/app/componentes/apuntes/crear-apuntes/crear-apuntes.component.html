<div *ngIf="cargando" 
     class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center bg-dark bg-opacity-75 z-3">
  <div class="spinner-border text-primary mb-3" role="status"></div>
  <h5 class="text-white fw-bold">Digitalizando apunte...</h5>
  <p class="text-secondary small">Esto puede tardar un poco...</p>
</div>

<div class="container-fluid min-vh-100 py-3 py-md-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8 col-xl-7">

      <div class="text-center mb-4 mb-md-5">
        <i class="bi bi-journal-plus text-primary mb-3 d-block display-3"></i>
        <h1 class="fw-bold text-light">Crear Apuntes</h1>
      </div>

      <div class="card bg-dark border border-secondary shadow-lg rounded-4">
        <div class="card-body p-4 p-md-5">
          <form (ngSubmit)="crearApuntes()" #formulario="ngForm">
            <div *ngIf="mensajeFeedback" class="alert mb-4" [ngClass]="'alert-' + tipoFeedback" role="alert">
              {{ mensajeFeedback }}
            </div>

            <div class="row mb-4">
              <div class="col-12 col-md-8">
                <label class="form-label fw-semibold text-light small uppercase">Título del apunte</label>
                <input type="text" name="titulo" [(ngModel)]="datosApunte.titulo"
                       class="form-control form-control-lg bg-black text-light border-secondary rounded-3 shadow-none"
                       placeholder="Ej: Historia del Arte..." required>
              </div>
              <div class="col-12 col-md-4 mt-3 mt-md-0">
                <label class="form-label fw-semibold text-light small uppercase">Categoría</label>
                <select name="categoria" [(ngModel)]="datosApunte.categoria" 
                        class="form-select form-select-lg bg-black text-light border-secondary rounded-3 shadow-none">
                  <option *ngFor="let cat of categorias" [value]="cat.valor">{{ cat.nombre }}</option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label fw-semibold text-light m-0">Descripción</label>
                <span class="badge rounded-pill" 
                      [ngClass]="datosApunte.descripcion.length >= 140 ? 'bg-danger' : 'bg-secondary bg-opacity-25 text-secondary'">
                  {{ datosApunte.descripcion.length }} / 150
                </span>
              </div>
              <textarea name="descripcion" [(ngModel)]="datosApunte.descripcion"
                        class="form-control bg-black text-light border-secondary rounded-3 shadow-none"
                        placeholder="Descripción de los apuntes..." rows="3" maxlength="150"></textarea>
            </div>

            <div class="mb-4 mb-md-5">
              <div class="border border-secondary border-2 rounded-4 p-3 p-md-5 text-center bg-black"
                   (dragover)="onDragOver($event)"
                   (drop)="onDrop($event)">
                <i class="bi bi-image text-secondary mb-3 d-block display-4"></i>
                <h5 class="text-light">Sube la foto de tu apunte</h5>
                <input type="file" id="fileInput" (change)="onFileSelected($event)" accept="image/*"
                       class="form-control bg-dark text-light border-secondary mt-3 shadow-none">
                <small class="text-secondary d-block mt-2">También puedes arrastrar una imagen aquí</small>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-3">
              <button type="button" class="btn btn-outline-light btn-lg rounded-pill px-4" (click)="limpiarFormulario()">
                Limpiar
              </button>
              <button type="submit" class="btn btn-primary btn-lg rounded-pill px-4 shadow" 
                      [disabled]="formulario.invalid || !archivoSeleccionado || cargando">
                <span>{{ cargando ? 'Digitalizando...' : 'Crear apuntes' }}</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
