<div class="container-fluid min-vh-100 py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8 col-xl-7">

      <div class="text-center mb-5">
        <i class="bi bi-journal-plus text-primary mb-3 d-block display-3"></i>
        <h1 class="fw-bold text-light">Crear Apuntes</h1>
        <p class="text-secondary mb-0">Digitaliza tus apuntes con IA</p>
      </div>

      <div class="card bg-dark border border-secondary shadow-lg rounded-4">
        <div class="card-body p-4 p-md-5">

          <form (ngSubmit)="crearApuntes()" #formulario="ngForm">

            <div *ngIf="mensajeFeedback" 
                 class="alert alert-{{tipoFeedback}} border-0 bg-opacity-10 text-{{tipoFeedback}} mb-4 rounded-3 d-flex align-items-center" 
                 role="alert">
              <i class="bi me-3" [ngClass]="{
                'bi-check-circle-fill': tipoFeedback === 'success', 
                'bi-exclamation-triangle-fill': tipoFeedback === 'danger'
              }"></i>
              <div>{{ mensajeFeedback }}</div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold text-light">Nombre del apunte</label>
              <input type="text" name="titulo" [(ngModel)]="datosApunte.titulo"
                     class="form-control form-control-lg bg-black text-light border-secondary rounded-3 shadow-none"
                     placeholder="Ej: Historia del Arte..." required>
            </div>

            <div class="row mb-4">
              <div class="col-md-6">
                <label class="form-label fw-semibold text-light">Categoría</label>
                <select name="categoria" [(ngModel)]="datosApunte.categoria" 
                        class="form-select form-select-lg bg-black text-light border-secondary rounded-3 shadow-none">
                  <option *ngFor="let cat of categorias" [value]="cat.valor">{{ cat.nombre }}</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-light">Dificultad (Opcional)</label>
                <select name="dificultad" class="form-select form-select-lg bg-black text-light border-secondary rounded-3 shadow-none">
                  <option value="basico">🟢 Básico</option>
                  <option value="intermedio">🟡 Intermedio</option>
                  <option value="avanzado">🔴 Avanzado</option>
                </select>
              </div>
            </div>

            <div class="mb-5">
              <div class="border border-secondary rounded-4 p-5 text-center bg-black" style="border-style: dashed !important;">
                <i class="bi bi-image text-secondary mb-3 d-block display-4"></i>
                <h5 class="text-light">Sube la foto de tu apunte</h5>
                <input type="file" id="fileInput" (change)="onFileSelected($event)" accept="image/*"
                       class="form-control bg-dark text-light border-secondary mt-3 shadow-none">
                
                <div *ngIf="archivoSeleccionado" class="mt-3 text-primary fw-bold">
                  <i class="bi bi-file-earmark-check me-1"></i> {{ archivoSeleccionado.name }}
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-3">
              <button type="button" class="btn btn-outline-light btn-lg rounded-pill px-4" 
                      [disabled]="cargando" (click)="limpiarFormulario()">
                Limpiar
              </button>
              
              <button type="submit" class="btn btn-primary btn-lg rounded-pill px-4 shadow" 
                      [disabled]="cargando || formulario.invalid || !archivoSeleccionado">
                <span *ngIf="!cargando">Digitalizar con IA</span>
                <span *ngIf="cargando">
                  <span class="spinner-border spinner-border-sm me-2"></span>Digitalizando...
                </span>
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
