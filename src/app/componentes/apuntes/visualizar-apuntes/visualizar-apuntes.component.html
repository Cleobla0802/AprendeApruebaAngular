<div *ngIf="notif.show" 
     class="alert alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow-lg alert-{{notif.type}} z-3" 
     role="alert">
  <div class="d-flex align-items-center gap-2">
    <i class="bi" [ngClass]="notif.type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'"></i>
    <span>{{ notif.msg }}</span>
    <button type="button" class="btn-close" (click)="notif.show = false"></button>
  </div>
</div>

<div class="container-fluid py-3 py-md-5 container-xxl" *ngIf="!cargando && apunte; else cargandoTemplate">
  <div class="row g-4">
    
    <div class="col-12 col-lg-4 col-xl-3 col-xxl-2">
      <div class="card bg-secondary bg-opacity-10 text-white rounded-4 border-0 shadow">
        <div class="card-body p-4">
          
          <div class="mb-4">
            <label class="form-label small fw-bold text-white text-uppercase">Título</label>
            <input type="text" class="form-control bg-dark text-white border-secondary shadow-none" 
                   [(ngModel)]="apunte.titulo">
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-white text-uppercase">Categoría</label>
            <select class="form-select bg-dark text-white border-secondary shadow-none" [(ngModel)]="apunte.categoria">
              <option value="matematicas">Matemáticas</option>
              <option value="ciencias">Ciencias</option>
              <option value="ingles">Inglés</option>
              <option value="tecnologia">Tecnología</option>
              <option value="historia">Historia</option>
            </select>
          </div>

            <div class="mb-4">
              <label class="form-label small fw-bold text-white text-uppercase">Descripción</label>
              <textarea class="form-control bg-dark text-white border-secondary shadow-none" 
                        rows="4" maxlength="150" [(ngModel)]="apunte.descripcion"></textarea>
              <div class="d-flex justify-content-end mt-1">
                <small [ngClass]="(apunte.descripcion?.length || 0) >= 150 ? 'text-danger' : 'text-white'">
                  {{ apunte.descripcion?.length || 0 }}/150
                </small>
              </div>
            </div>

          <div class="mt-2 pt-3 border-top border-secondary border-opacity-25">
            <button class="btn btn-primary w-100 rounded-pill mb-2" (click)="guardarCambios()">
              Guardar Cambios
            </button>
            <button class="btn btn-outline-primary w-100 rounded-pill" (click)="router.navigate(['/componentes/apuntes'])">
              Volver
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-8 col-xl-9 col-xxl-10 d-flex">
      <div class="card bg-dark text-white rounded-4 border-secondary shadow overflow-hidden w-100">
        <div class="bg-black bg-opacity-50 p-3 border-bottom border-secondary border-opacity-25">
          <small class="fw-bold text-primary text-uppercase ms-2">Contenido del Apunte</small>
        </div>
        <textarea [(ngModel)]="apunte.contenido" 
                  class="form-control bg-transparent text-white border-0 p-4 shadow-none flex-grow-1 h-100" 
                  rows="20"></textarea>
        </div>
    </div>

  </div>
</div>

<ng-template #cargandoTemplate>
  <div class="d-flex flex-column align-items-center justify-content-center py-5 min-vh-100">
    <div class="spinner-border text-primary mb-3" role="status"></div>
    <p class="text-secondary">Cargando apunte...</p>
  </div>
</ng-template>
