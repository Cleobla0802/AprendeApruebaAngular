<div class="container py-3 py-md-5">
  <h1 class="text-center text-white mb-4 mb-md-5 display-6 display-md-4 fw-bold">
    ¡AQUÍ TIENE SUS APUNTES!
  </h1>

  <div *ngIf="notif.show" 
       class="alert alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow-lg z-3 alert-{{notif.type}}" 
       role="alert">
    <div class="d-flex align-items-center gap-2">
      <i class="bi" [ngClass]="notif.type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'"></i>
      <span>{{ notif.msg }}</span>
      <button type="button" class="btn-close" (click)="notif.show = false"></button>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-12 col-lg-8 mx-auto">
      <label for="buscadorApuntes" class="form-label text-secondary mb-2 ms-1 small">
        <i class="bi bi-search me-1"></i> BUSCA TUS APUNTES
      </label>
      <div class="input-group input-group-lg shadow-sm">
        <span class="input-group-text bg-dark border-secondary text-secondary">
          <i class="bi bi-search"></i>
        </span>
        <input id="buscadorApuntes" type="text" 
               class="form-control bg-dark text-white border-secondary shadow-none" 
               [(ngModel)]="buscarApunte" (input)="filtrarApuntes()">
      </div>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-4 mb-md-5 justify-content-center">
    <input type="checkbox" class="btn-check" id="f-matematicas" (change)="toggleCategoria('matematicas')">
    <label class="btn btn-outline-primary btn-sm rounded-pill px-3" for="f-matematicas">Matemáticas</label>

    <input type="checkbox" class="btn-check" id="f-ciencias" (change)="toggleCategoria('ciencias')">
    <label class="btn btn-outline-success btn-sm rounded-pill px-3" for="f-ciencias">Ciencias</label>

    <input type="checkbox" class="btn-check" id="f-ingles" (change)="toggleCategoria('ingles')">
    <label class="btn btn-outline-info btn-sm rounded-pill px-3" for="f-ingles">Inglés</label>

    <input type="checkbox" class="btn-check" id="f-historia" (change)="toggleCategoria('historia')">
    <label class="btn btn-outline-warning btn-sm rounded-pill px-3" for="f-historia">Historia</label>

    <input type="checkbox" class="btn-check" id="f-tecnologia" (change)="toggleCategoria('tecnologia')">
    <label class="btn btn-outline-danger btn-sm rounded-pill px-3" for="f-tecnologia">Tecnología</label>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
    
    <div class="col-12 text-center py-5" *ngIf="cargando">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <p class="text-secondary fw-light">Consultando Firebase...</p>
    </div>

    <div class="col-12 text-center py-5" *ngIf="!cargando && listaApuntes.length === 0">
      <div class="display-1 text-secondary opacity-25 mb-3">
        <i class="bi bi-folder-x"></i>
      </div>
      <h4 class="text-secondary fw-light">No se han encontrado apuntes registrados</h4>
    </div>

    <div class="col" *ngFor="let apunte of listaApuntes">
      <div class="card h-100 bg-dark border-secondary shadow rounded-4 overflow-hidden">
        <div class="card-body p-4 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span [class]="'badge rounded-pill px-3 py-2 bg-' + getBgColor(apunte.categoria) + ' bg-opacity-10 text-' + getBgColor(apunte.categoria)">
              {{ (apunte.categoria || 'Sin categoría') | titlecase }}
            </span>
            <small class="text-secondary opacity-75 small">
              <i class="bi bi-calendar3 me-1"></i>{{ apunte.fecha | date:'dd/MM/yy' }}
            </small>
          </div>
          <h5 class="card-title text-white fw-bold mb-2">{{ apunte.titulo }}</h5>
          <p class="card-text text-secondary small flex-grow-1 mb-0 opacity-75">
            {{ apunte.descripcion || 'Sin descripción.' }}
          </p>
          <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 d-flex gap-2">
            <a [routerLink]="['/componentes/apuntes/visualizar-apuntes', apunte.id]" 
               class="btn btn-sm btn-outline-light rounded-pill flex-grow-1">
              Ver detalles
            </a>
            <button class="btn btn-sm btn-outline-danger rounded-circle" (click)="eliminar(apunte.id)">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center mt-4 mt-md-5">
    <a routerLink="/componentes/apuntes/crear-apuntes" class="btn btn-primary btn-lg rounded-pill px-5 shadow">
      <i class="bi bi-plus-lg me-2"></i>Nuevo Apunte
    </a>
  </div>
</div>
